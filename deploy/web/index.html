<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrivacyGate</title>
<meta name="description" content="Mask personal information in English, German, French, Italian and Spanish text.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  (() => {
    let saved = null;
    try { saved = localStorage.getItem("pg-theme"); } catch (_) {}
    const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
<style>
  :root, [data-theme="light"] {
    --bg: #f4f3f7; --ink: #15151a; --muted: #77778a; --soft: rgba(21, 21, 26, .06);
    --glass: rgba(255, 255, 255, .58); --glass-2: rgba(255, 255, 255, .72); --rim: rgba(255, 255, 255, .85);
    --hair: rgba(21, 21, 26, .08); --shadow: 0 30px 80px -30px rgba(40, 30, 80, .28), 0 2px 6px rgba(40, 30, 80, .05);
    --btn: #15151a; --btn-ink: #fff; --orb: .55; --danger: #c0344d;
    --name: #ea4c74; --contact: #1e9be0; --place: #17a77c; --money: #e8930c; --id: #7d5cf5;
    --on-money: #3d2600;
  }
  [data-theme="dark"] {
    --bg: #0b0b10; --ink: #eeeef2; --muted: #8a8a9c; --soft: rgba(255, 255, 255, .06);
    --glass: rgba(24, 24, 32, .55); --glass-2: rgba(34, 34, 44, .7); --rim: rgba(255, 255, 255, .09);
    --hair: rgba(255, 255, 255, .07); --shadow: 0 30px 80px -30px rgba(0, 0, 0, .7), 0 2px 6px rgba(0, 0, 0, .3);
    --btn: #eeeef2; --btn-ink: #0b0b10; --orb: .34; --danger: #ff7d93;
    --name: #ff6b8e; --contact: #3fb4f5; --place: #2fcf9c; --money: #ffb43d; --id: #9b82ff;
    --on-money: #3d2600;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); transition: background .3s; }
  html, body { margin: 0; color: var(--ink); }
  body { font: 15px/1.6 "Geist", ui-sans-serif, -apple-system, sans-serif; -webkit-font-smoothing: antialiased;
         min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
         background: transparent; position: relative; z-index: 0; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--contact); outline-offset: 2px; border-radius: 10px; }
  [hidden] { display: none !important; }

  /* ambient colour field: the masking palette, blurred */
  .orbs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .orbs i { position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(90px); opacity: var(--orb);
            animation: drift 38s ease-in-out infinite alternate; }
  .orbs i:nth-child(1) { background: var(--name); top: -18vmax; left: -10vmax; }
  .orbs i:nth-child(2) { background: var(--contact); top: -12vmax; right: -16vmax; animation-delay: -9s; }
  .orbs i:nth-child(3) { background: var(--id); bottom: -24vmax; left: 18vw; animation-delay: -17s; width: 40vmax; height: 40vmax; }
  .orbs i:nth-child(4) { background: var(--place); bottom: -20vmax; right: -8vmax; animation-delay: -25s; width: 30vmax; height: 30vmax; opacity: calc(var(--orb) * .7); }
  @keyframes drift { to { transform: translate3d(6vmax, 4vmax, 0) scale(1.08); } }

  .glass { background: var(--glass); border: 1px solid var(--rim); box-shadow: var(--shadow), inset 0 1px 0 var(--rim);
           backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%); }

  .wrap { width: 100%; max-width: 820px; padding: 0 24px; }
  header { display: flex; align-items: center; justify-content: space-between; height: 84px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -0.025em; font-size: 16.5px; }
  .glyph { display: grid; gap: 3px; width: 18px; }
  .glyph b { height: 3.5px; border-radius: 2px; background: var(--ink); }
  .glyph b:nth-child(2) { width: 62%; background: var(--name); }
  .glyph b:nth-child(3) { width: 82%; }
  .theme { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
  .theme i { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--ink);
             background: linear-gradient(90deg, var(--ink) 50%, transparent 50%); transition: transform .4s; }
  [data-theme="dark"] .theme i { transform: rotate(180deg); }

  main { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; padding-top: clamp(24px, 9vh, 96px); padding-bottom: 6vh; }
  .hero { padding: 0 4px 22px; }
  .hero h1 { text-wrap: balance; margin: 0 0 6px; font: 600 clamp(26px, 4.2vw, 36px)/1.15 "Geist", ui-sans-serif, sans-serif; letter-spacing: -0.035em; }
  .hero p { margin: 0; color: var(--muted); font-size: 15.5px; }
  .clear { position: absolute; top: 14px; right: 14px; z-index: 3; width: 32px; height: 32px; border-radius: 50%;
           color: var(--muted); font-size: 18px; line-height: 1; display: grid; place-items: center; }
  .clear:hover { color: var(--ink); background: var(--soft); }
  .body.busy::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 4;
                      background: linear-gradient(100deg, transparent 35%, color-mix(in srgb, var(--contact) 16%, transparent) 50%, transparent 65%);
                      background-size: 260% 100%; animation: scan 1.5s linear infinite; }
  @keyframes scan { from { background-position: 130% 0; } to { background-position: -30% 0; } }
  .body.busy textarea { color: var(--muted); }
  .hint { position: absolute; z-index: 3; bottom: 14px; left: var(--x); transform: translateX(-50%); white-space: nowrap;
          font-size: 12.5px; color: var(--ink); padding: 6px 11px; border-radius: 999px; pointer-events: none;
          transition: opacity .4s; }
  .hint.gone { opacity: 0; }
  .try { font-size: 13px; color: var(--muted); margin-right: 4px; white-space: nowrap; }
  .short { display: none; }
  .card { border-radius: 26px; overflow: hidden; display: flex; flex-direction: column; }
  .body { position: relative; height: min(54vh, 460px); min-height: 280px; display: flex; }
  textarea, .layer { padding: 26px 28px; font: 17.5px/1.85 "Geist", ui-sans-serif, sans-serif; color: var(--ink);
                     letter-spacing: -0.005em; }
  textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; }
  textarea:focus-visible { outline: none; }
  textarea::placeholder { color: var(--muted); }

  /* before / after */
  .body.result { height: auto; min-height: 240px; max-height: min(54vh, 460px); }
  .stage { flex: 1; min-height: 0; overflow: auto; position: relative; overscroll-behavior: contain;
           -webkit-user-select: none; user-select: none; }
  .stage ::selection { background: transparent; color: inherit; }
  .bar::selection { color: transparent; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: pre-wrap; }
  .stack { position: relative; min-height: 100%; }
  .layer { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; padding-top: 62px; }
  .layer.before { position: absolute; inset: 0; clip-path: inset(0 calc(100% - var(--x)) 0 0); background: var(--glass-2); }
  .layer.after { clip-path: inset(0 0 0 var(--x)); }
  .hl { border-radius: 5px; padding: 2px 2px; margin: 0 -2px; background: color-mix(in srgb, var(--c) 16%, transparent);
        box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--c) 70%, transparent);
        -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .bar { position: relative; border-radius: 6px; padding: 2px 2px; margin: 0 -2px; color: transparent;
         background: linear-gradient(100deg, var(--c), color-mix(in srgb, var(--c) 78%, #fff));
         box-shadow: 0 6px 18px -8px var(--c);
         -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .bar::after { content: attr(data-l); position: absolute; left: 8px; top: calc(.65em + 2px); transform: translateY(-50%);
                font: 600 10.5px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase;
                color: var(--on, rgba(255, 255, 255, .96)); white-space: nowrap; }
  /* short values never wrap, so their bar is one clean block with a centred label */
  .nw { display: inline-block; white-space: nowrap; line-height: 1.3; }
  .bar.nw { overflow: hidden; vertical-align: bottom; }
  .hl.nw { vertical-align: bottom; }
  .bar.nw::after { left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: calc(100% - 6px); overflow: hidden; text-overflow: clip; }
  .reveal .bar { animation: sweep .55s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 60ms); }
  @keyframes sweep { from { clip-path: inset(0 100% 0 0 round 6px); } to { clip-path: inset(0 0 0 0 round 6px); } }
  .g-name { --c: var(--name); } .g-contact { --c: var(--contact); } .g-place { --c: var(--place); }
  .g-money { --c: var(--money); --on: var(--on-money); } .g-id { --c: var(--id); }

  .curtain { position: absolute; top: 0; bottom: 0; left: var(--x); width: 0; z-index: 2; pointer-events: none; }
  .curtain::before { content: ""; position: absolute; top: 0; bottom: 0; left: -0.5px; width: 1px;
                     background: linear-gradient(transparent, var(--ink) 18%, var(--ink) 82%, transparent); opacity: .35; }
  .handle { position: absolute; z-index: 3; top: 28px; left: var(--x); transform: translate(-50%, -50%);
            width: 42px; height: 42px; border-radius: 50%; cursor: ew-resize; touch-action: none; display: grid; place-items: center;
            background: color-mix(in srgb, var(--bg) 88%, transparent) !important; transition: transform .15s; }
  .handle:hover, .handle:active { transform: translate(-50%, -50%) scale(1.08); }
  .handle::before { content: ""; width: 12px; height: 12px; border: solid var(--ink); border-width: 0 1.5px;
                    opacity: .7; }
  .tag { position: absolute; top: 14px; z-index: 3; font: 500 11px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .08em;
         text-transform: uppercase; color: var(--muted); padding: 8px 11px; border-radius: 999px; transition: opacity .2s, color .15s; }
  .tag:hover { color: var(--ink); }
  .tag.l { left: 16px; } .tag.r { right: 22px; }
  .intro .curtain, .intro .handle, .intro .layer { transition: left .9s cubic-bezier(.2, .8, .2, 1), clip-path .9s cubic-bezier(.2, .8, .2, 1); }

  .tools { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 64px;
           padding: 0 12px 0 18px; border-top: 1px solid var(--hair); }
  .group { display: flex; align-items: center; gap: 2px; }
  .chip { font: 500 13px/1 "Geist", ui-sans-serif, sans-serif; color: var(--muted); padding: 9px 9px; border-radius: 9px; transition: color .15s, background .15s; }
  .chip:disabled { opacity: .5; cursor: default; }
  .chip:hover, .chip.on { color: var(--ink); }
  .chip:hover { background: var(--soft); }
  .note { font: 12px "Geist Mono", ui-monospace, monospace; color: var(--muted); margin-left: auto; margin-right: 4px; }
  .note.err { color: var(--danger); }
  .legend { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .legend::-webkit-scrollbar { display: none; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
  .legend i { font-style: normal; }
  .legend b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  .quiet { color: var(--muted); font-size: 14px; padding: 9px 12px; border-radius: 10px; }
  .quiet:hover { background: var(--soft); color: var(--ink); }
  .go { background: var(--btn); color: var(--btn-ink); font-weight: 500; font-size: 14px; padding: 10px 20px;
        border-radius: 999px; min-width: 96px; transition: opacity .15s, transform .15s; }
  .go:not(:disabled):hover { transform: translateY(-1px); }
  .go:disabled { opacity: .28; cursor: default; }
  .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  footer { height: 64px; display: flex; align-items: center; justify-content: center; gap: 18px; font-size: 12.5px; color: var(--muted); }
  footer a { color: inherit; text-decoration: none; }
  footer a:hover { color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    .orbs i, .reveal .bar, .dots::after, .body.busy::after { animation: none; }
    .intro .curtain, .intro .handle, .intro .layer { transition: none; }
  }
  @media (max-width: 560px) {
    .wrap { padding: 0 14px; }
    header { height: 70px; }
    .card { border-radius: 22px; }
    .body { height: 46vh; }
    main { padding-top: 20px; }
    .hero h1 { font-size: 27px; }
    textarea, .layer { font-size: 16px; padding: 20px; }
    .chip { padding: 9px 7px; font: 500 12px/1 "Geist Mono", ui-monospace, monospace; }
    .long { display: none; } .short { display: inline; }
    .hero { padding-bottom: 16px; } .hero p { font-size: 14px; }
    header { height: 60px; }
    .tools { padding: 0 8px 0 12px; }
    .legend { gap: 10px; font-size: 12px; }
    .layer { padding-top: 56px; }
    .quiet { padding: 9px 8px; }
    .go { min-width: 0; padding: 10px 16px; }
    footer { flex-direction: column; gap: 2px; height: 76px; }
  }
</style>
</head>
<body>
<div class="orbs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<div class="wrap">
  <header>
    <div class="logo"><span class="glyph" aria-hidden="true"><b></b><b></b><b></b></span>PrivacyGate</div>
    <button class="theme glass" id="theme" aria-label="Toggle dark mode" title="Toggle dark mode"><i></i></button>
  </header>
</div>

<main class="wrap">
  <div class="hero">
    <h1>Hide personal details in any text.</h1>
    <p>Names, phone numbers, emails, addresses and bank numbers, in five languages.</p>
  </div>
  <div class="card glass">
    <div class="body" id="body">
      <textarea id="input" spellcheck="false" placeholder="Paste or type some text, or try an example below." aria-label="Text to mask"></textarea>
      <button class="clear" id="clear" hidden aria-label="Clear text" title="Clear">×</button>
      <div class="stage" id="stage" hidden>
        <div class="stack">
          <div class="layer after" id="after" aria-hidden="true"></div>
          <div class="layer before" id="before" aria-hidden="true"></div>
        </div>
        <div class="sr" id="sr" aria-live="polite"></div>
      </div>
      <div class="curtain" id="curtain" hidden></div>
      <div class="handle glass" id="handle" role="slider" tabindex="0" hidden
           aria-label="Before and after" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"></div>
      <button class="tag l glass" id="tag-l" hidden title="Show original">Before</button>
      <button class="tag r glass" id="tag-r" hidden title="Show masked">After</button>
      <span class="hint glass gone" id="hint" aria-hidden="true">Drag or tap to compare</span>
    </div>

    <div class="tools" id="edit-tools">
      <div class="group" role="group" aria-label="Try an example">
        <span class="try"><span class="long">Try an example</span><span class="short">Try</span></span>
        <button class="chip" data-lang="en"><span class="long">English</span><span class="short">EN</span></button>
        <button class="chip" data-lang="de"><span class="long">Deutsch</span><span class="short">DE</span></button>
        <button class="chip" data-lang="fr"><span class="long">Français</span><span class="short">FR</span></button>
        <button class="chip" data-lang="it"><span class="long">Italiano</span><span class="short">IT</span></button>
        <button class="chip" data-lang="es"><span class="long">Español</span><span class="short">ES</span></button>
      </div>
      <span class="note" id="status"></span>
      <button class="go" id="run" disabled title="⌘/Ctrl + Enter">Mask text</button>
    </div>

    <div class="tools" id="result-tools" hidden>
      <div class="legend" id="legend"></div>
      <div class="group">
        <button class="quiet" id="copy" title="Copy the masked text">Copy</button>
        <button class="go" id="back">Edit text</button>
      </div>
    </div>
  </div>
</main>

<footer class="wrap">
  <span>Synthetic data only · nothing is stored</span>
  <a href="https://github.com/nfcolak/privacygate" target="_blank" rel="noopener">GitHub</a>
</footer>

<script>
(() => {
  const MAX = 8000;
  const SAMPLES = {
    en: "Daniel Whitmore here. Call me on +44 20 7946 0958 or write to daniel.w@example.org.",
    de: "Bitte Anna Keller unter +41 44 123 45 67 anrufen. Adresse: Bahnhofstrasse 12, 8001 Zürich.",
    fr: "Claire Moreau habite 27 rue des Lilas, 69003 Lyon. IBAN : FR76 3000 6000 0112 3456 7890 189.",
    it: "Gentile Marco Bellini, la fattura è stata inviata a marco.bellini@example.it. Chiami il +39 02 1234 5678.",
    es: "Lucía Fernández vive en Calle Mayor 8, 28013 Madrid. Teléfono: +34 612 345 678."
  };
  const NAMES = {
    PERSONNAME: "name", GIVENNAME: "name", SURNAME: "surname", MIDDLENAME: "name", TITLE: "title", USERNAME: "username",
    EMAIL: "email", TELEPHONENUM: "phone",
    ADDRESS: "address", STREET: "street", BUILDINGNUM: "number", CITY: "city", ZIPCODE: "postcode", STATE: "state",
    COUNTY: "county", COUNTRY: "country", POBOX: "po box",
    IBAN: "iban", ACCOUNTNUM: "account", CREDITCARDNUMBER: "card", TAXNUM: "tax id",
    PASSPORTNUM: "passport", IDCARDNUM: "id card", DRIVERLICENSENUM: "licence", SOCIALNUM: "social no", PERSONALREF: "ref",
    AGE: "age", DATEOFBIRTH: "birth date"
  };
  const GROUPS = [
    ["name", "Names", ["PERSONNAME", "GIVENNAME", "SURNAME", "MIDDLENAME", "TITLE", "USERNAME"]],
    ["contact", "Contact", ["EMAIL", "TELEPHONENUM"]],
    ["place", "Address", ["ADDRESS", "STREET", "BUILDINGNUM", "CITY", "ZIPCODE", "STATE", "COUNTY", "COUNTRY", "POBOX"]],
    ["money", "Financial", ["IBAN", "ACCOUNTNUM", "CREDITCARDNUMBER", "TAXNUM"]],
    ["id", "IDs", ["PASSPORTNUM", "IDCARDNUM", "DRIVERLICENSENUM", "SOCIALNUM", "PERSONALREF", "AGE", "DATEOFBIRTH"]]
  ];
  const groupOf = l => (GROUPS.find(g => g[2].includes(l)) || GROUPS[4])[0];
  const ERRORS = { rate_limited: "Too many requests, wait a minute", too_long: "Over 8,000 characters", network: "Can't reach the server" };
  const $ = id => document.getElementById(id);
  const input = $("input"), run = $("run"), status = $("status"), copy = $("copy"), body = $("body");
  let result = null, busy = false, x = 50, warm = false;

  // Wake the model while the visitor reads or types, so the first mask is fast.
  fetch("/api/health", { cache: "no-store" }).then(r => { if (r.ok) warm = true; }).catch(() => {});

  $("theme").onclick = () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("pg-theme", next); } catch (_) {}
  };

  const node = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const say = (text, isError) => { status.textContent = text; status.classList.toggle("err", !!isError); };

  function update() {
    const n = input.value.length;
    run.disabled = busy || !input.value.trim() || n > MAX;
    if (!busy) say(n > MAX ? ERRORS.too_long : n > MAX * 0.75 ? n.toLocaleString("en-US") + " / 8,000" : "", n > MAX);
    document.querySelectorAll(".chip").forEach(c => { c.classList.toggle("on", SAMPLES[c.dataset.lang] === input.value); c.disabled = busy; });
    $("clear").hidden = busy || !input.value || input.hidden;
  }

  function setX(v) {
    x = Math.max(0, Math.min(100, v));
    body.style.setProperty("--x", x + "%");
    $("handle").setAttribute("aria-valuenow", String(Math.round(x)));
    $("tag-l").style.opacity = x < 14 ? 0 : 1;
    $("tag-r").style.opacity = x > 86 ? 0 : 1;
  }

  function showResult(on) {
    input.hidden = on;
    body.classList.toggle("result", on);
    ["stage", "curtain", "handle", "tag-l", "tag-r", "result-tools"].forEach(id => $(id).hidden = !on);
    $("edit-tools").hidden = on;
    $("clear").hidden = on || !input.value;
    if (!on) $("hint").classList.add("gone");
  }

  function render(text, entities) {
    const before = $("before"), after = $("after");
    before.replaceChildren(); after.replaceChildren();
    let pos = 0;
    entities.forEach((e, i) => {
      const gap = text.slice(pos, e.start), val = text.slice(e.start, e.end), g = "g-" + groupOf(e.label);
      const nw = val.length <= 36 && !val.includes("\n") ? " nw" : "";
      before.append(document.createTextNode(gap), node("span", "hl " + g + nw, val));
      const bar = node("span", "bar " + g + nw, val);
      bar.dataset.l = NAMES[e.label] || e.label.toLowerCase();
      bar.style.setProperty("--i", i);
      after.append(document.createTextNode(gap), bar);
      pos = e.end;
    });
    before.append(document.createTextNode(text.slice(pos)));
    after.append(document.createTextNode(text.slice(pos)));
    $("sr").textContent = result.masked_text;

    const counts = {};
    entities.forEach(e => { const g = groupOf(e.label); counts[g] = (counts[g] || 0) + 1; });
    const legend = $("legend");
    legend.replaceChildren();
    GROUPS.filter(g => counts[g[0]]).forEach(([k, name]) => {
      const s = node("span", "g-" + k);
      s.title = name;
      s.append(node("i", "n", name + " "), node("b", null, String(counts[k])));
      legend.append(s);
    });
    if (!entities.length) legend.append(node("span", null, "Nothing found to mask"));
  }

  async function mask() {
    if (run.disabled) return;
    busy = true; update();
    body.classList.add("busy");
    run.replaceChildren(node("span", "dots", "Masking"));
    const slow = setTimeout(() => say(warm ? "Still working…" : "Starting the model, about 30 s the first time…"), warm ? 4000 : 1200);
    const text = input.value;
    let error = null;
    try {
      const res = await fetch("/api/mask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
      const data = await res.json().catch(() => ({}));
      if (data.status === "ok") {
        result = data;
        render(text, data.entities);
        $("stage").scrollTop = 0;
        body.classList.remove("intro", "reveal");
        setX(100); showResult(true);
        void body.offsetWidth;
        body.classList.add("intro", "reveal");
        requestAnimationFrame(() => setX(0));          // wipe: before -> after
        setTimeout(() => setX(50), 1150);              // settle mid-way so the curtain is discoverable
        setTimeout(() => body.classList.remove("intro"), 2100);
        if (!hinted) { setTimeout(() => $("hint").classList.remove("gone"), 2100); setTimeout(dismissHint, 7000); }
        warm = true;
      } else error = ERRORS[data.error] || "Something went wrong";
    } catch (_) { error = ERRORS.network; }
    clearTimeout(slow);
    body.classList.remove("busy");
    busy = false; run.textContent = "Mask text"; update();
    if (error) say(error, true);
  }

  // curtain drag
  const handle = $("handle");
  let hinted = false;
  try { hinted = localStorage.getItem("pg-hinted") === "1"; } catch (_) {}
  function dismissHint() {
    $("hint").classList.add("gone");
    if (!hinted) { hinted = true; try { localStorage.setItem("pg-hinted", "1"); } catch (_) {} }
  }
  handle.addEventListener("pointerdown", e => {
    e.preventDefault();
    dismissHint();
    body.classList.remove("intro");
    handle.setPointerCapture(e.pointerId);
    const move = ev => { const r = body.getBoundingClientRect(); setX((ev.clientX - r.left) / r.width * 100); };
    const up = () => { handle.removeEventListener("pointermove", move); handle.removeEventListener("pointerup", up); };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", up);
  });
  handle.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") { setX(x - 5); e.preventDefault(); }
    if (e.key === "ArrowRight") { setX(x + 5); e.preventDefault(); }
    if (e.key === "Home") { setX(0); e.preventDefault(); }
    if (e.key === "End") { setX(100); e.preventDefault(); }
  });
  let glideTimer = 0;
  function glide(v) {
    body.classList.add("intro"); setX(v);
    clearTimeout(glideTimer); glideTimer = setTimeout(() => body.classList.remove("intro"), 950);
  }
  $("tag-l").onclick = () => { dismissHint(); glide(100); };
  $("tag-r").onclick = () => { dismissHint(); glide(0); };
  // tap anywhere on the text to move the curtain there
  $("stage").addEventListener("click", e => {
    const r = body.getBoundingClientRect();
    dismissHint(); glide((e.clientX - r.left) / r.width * 100);
  });

  input.addEventListener("input", update);
  input.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); mask(); } });
  run.onclick = mask;
  $("back").onclick = () => { showResult(false); update(); input.focus(); };
  $("clear").onclick = () => { input.value = ""; update(); input.focus(); };
  copy.onclick = async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(result.masked_text); ok = true; }
    catch (_) {
      const t = node("textarea", null, result.masked_text);
      t.style.cssText = "position:fixed;opacity:0"; document.body.append(t); t.select();
      try { ok = document.execCommand("copy"); } catch (_) {}
      t.remove();
    }
    copy.textContent = ok ? "Copied ✓" : "Copy failed";
    setTimeout(() => copy.textContent = "Copy", 1500);
  };
  // one click: load a one-line sample and mask it right away
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    if (busy) return;
    input.value = SAMPLES[c.dataset.lang]; update(); mask();
  });
  setX(50);
  update();
  if (matchMedia("(pointer: fine)").matches) input.focus({ preventScroll: true });
})();
</script>
</body>
</html>
