[project]
name = "privacygate"
version = "0.0.1"
description = "Research prototype: regex-only PII masking baseline (synthetic data only)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
privacygate = "privacygate.cli:main"

[tool.setuptools]
packages = ["privacygate"]
