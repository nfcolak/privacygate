[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "privacygate"
version = "0.0.1"
description = "Research prototype: multilingual PII masking (synthetic data only)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
privacygate = "privacygate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["privacygate", "privacygate.*"]
namespaces = false
